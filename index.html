<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12222B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>영어 패턴 50</title>
<style>
:root{--bg:#12222B;--card:#1E3540;--line:#3A525B;--text:#EAF1EE;--sub:#9FB3B8;--hi:#F2C14E;--on-hi:#2A1F00}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
#app{height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#top{flex:1;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:16px 20px 14px;min-height:0}
#bar{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;color:var(--sub)}
#pick{border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 14px;color:var(--sub);font-size:14px}
#auto{border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 14px;color:var(--sub);font-size:14px}
#auto.on{background:var(--hi);color:var(--on-hi);border-color:var(--hi)}
#en{font-size:clamp(24px,7vw,32px);line-height:1.3;font-weight:500;overflow-wrap:anywhere}
#en b{color:var(--hi);font-weight:500}
#ko{font-size:16px;color:var(--sub);margin-top:12px;line-height:1.5}
#pat{font-size:13px;color:var(--sub);margin-bottom:10px}
#dots{display:flex;gap:6px;align-items:center;min-height:6px}
#dots span{height:6px;border-radius:999px;background:var(--line);width:6px}
#dots span.on{background:var(--hi);width:18px}
#ctl{flex:1;min-height:0;padding:14px 16px 18px;display:flex;flex-direction:column;justify-content:center;gap:12px;border-top:1.5px dashed var(--hi)}
.row{display:flex;gap:8px}
.pl{flex:1;height:60px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:16px}
.pl.on{background:var(--hi);color:var(--on-hi);border-color:var(--hi);font-weight:500}
.nv{flex:1;height:52px;border-radius:999px;background:transparent;border:1px solid var(--line);color:var(--sub);font-size:15px}
.nv.go{border-color:var(--sub);color:var(--text)}
#msg{font-size:13px;color:var(--sub);text-align:center;min-height:16px}
#sheet{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);z-index:5}
#sheet.open{display:flex}
#sh-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px 8px;font-size:15px}
#sh-close{border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 14px;color:var(--sub);font-size:14px}
#lv1,#groups{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.g{border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 14px;font-size:14px;color:var(--sub)}
.g.on{background:var(--hi);color:var(--on-hi);border-color:var(--hi)}
#plist{flex:1;overflow-y:auto;padding:0 20px 20px}
.p{display:flex;gap:14px;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--line);padding:14px 2px;font-size:16px}
.p i{font-style:normal;color:var(--sub);min-width:28px}
.p.on{color:var(--hi)}
.p small{display:block;font-size:12px;color:var(--sub);margin-top:3px}
.lb{width:100%;font-size:12px;color:var(--sub)}
#mode{padding:8px 20px 4px;display:flex;gap:8px}
#lv1{padding:8px 20px 4px}#groups{padding:4px 20px 12px}
</style>
</head>
<body>
<div id="app">
<section id="top">
<div id="bar"><button id="pick" aria-haspopup="dialog"></button><button id="auto" aria-pressed="false">자동 재생</button><span id="cnt"></span></div>
<div><div id="pat"></div><div id="en"></div><div id="ko"></div></div>
<div id="dots"></div>
</section>
<section id="ctl">
<div id="msg" role="status"></div>
<div class="row">
<button class="pl" data-k="ko">한국어</button>
<button class="pl" data-k="slow">천천히</button>
<button class="pl" data-k="normal">보통</button>
</div>
<div class="row">
<button class="nv" id="prev">‹ 이전</button>
<button class="nv go" id="next">다음 ›</button>
</div>
</section>
</div>
<div id="sheet" role="dialog" aria-label="패턴 고르기">
<div id="sh-head"><span>패턴 고르기</span><button id="sh-close">닫기</button></div>
<div id="mode"></div>
<div id="lv1" class="chips"></div>
<div id="groups" class="chips"></div>
<div id="plist"></div>
</div>
<script>
var DATA=[{"g":"부탁하기","p":[{"n":1,"o":2,"t":"Could you ___?","e":[{"id":"p002_02","en":"Could you call a taxi for me?","ko":"택시 좀 불러주실 수 있어요?"},{"id":"p002_06","en":"Could you check my reservation?","ko":"제 예약 좀 확인해주실 수 있어요?"},{"id":"p002_09","en":"Could you take our order now?","ko":"지금 주문 받아주실 수 있어요?"},{"id":"p002_10","en":"Could you tell me the way to the museum?","ko":"박물관 가는 길 알려주실 수 있어요?"}]},{"n":2,"o":3,"t":"Can you ___ for me?","e":[{"id":"p003","en":"Can you take a picture for me?","ko":"사진 좀 찍어주실래요?"},{"id":"p003_05","en":"Can you book a table for me?","ko":"자리 좀 예약해줄래요?"},{"id":"p003_06","en":"Can you translate this for me?","ko":"이것 좀 번역해줄래요?"},{"id":"p003_10","en":"Can you find the address for me?","ko":"주소 좀 찾아줄래요?"}]},{"n":3,"o":1,"t":"Could I get ___, please?","e":[{"id":"p001","en":"Could I get a glass of water, please?","ko":"물 한 잔 주실 수 있나요?"},{"id":"p001_02","en":"Could I get the check, please?","ko":"계산서 주실 수 있나요?"},{"id":"p001_03","en":"Could I get an extra towel, please?","ko":"수건 한 장 더 주실 수 있나요?"},{"id":"p001_09","en":"Could I get a map, please?","ko":"지도 하나 주실 수 있나요?"}]},{"n":4,"o":8,"t":"Can I have ___?","e":[{"id":"p008","en":"Can I have the menu?","ko":"메뉴판 주실래요?"},{"id":"p008_06","en":"Can I have this to go?","ko":"이거 포장해주실래요?"},{"id":"p008_07","en":"Can I have a receipt?","ko":"영수증 주실래요?"},{"id":"p008_10","en":"Can I have your Wi-Fi password?","ko":"와이파이 비밀번호 알려주실래요?"}]},{"n":5,"o":6,"t":"Do you have ___?","e":[{"id":"p006","en":"Do you have this in a smaller size?","ko":"이거 더 작은 사이즈 있어요?"},{"id":"p006_02","en":"Do you have a table for two?","ko":"두 명 자리 있어요?"},{"id":"p006_05","en":"Do you have any rooms available?","ko":"빈 방 있어요?"},{"id":"p006_08","en":"Do you have free Wi-Fi?","ko":"무료 와이파이 있어요?"}]}]},{"g":"원하는 것 말하기","p":[{"n":6,"o":11,"t":"I'd like ___.","e":[{"id":"p011","en":"I'd like a table for two.","ko":"두 명 자리로 부탁해요."},{"id":"p011_04","en":"I'd like a room with a view.","ko":"전망 좋은 방으로 하고 싶어요."},{"id":"p011_05","en":"I'd like two tickets for tonight.","ko":"오늘 밤 표 두 장 주세요."},{"id":"p011_06","en":"I'd like a refund.","ko":"환불받고 싶어요."}]},{"n":7,"o":12,"t":"I'd like to ___.","e":[{"id":"p012","en":"I'd like to check in.","ko":"체크인하고 싶어요."},{"id":"p012_03","en":"I'd like to change my flight.","ko":"항공편을 바꾸고 싶어요."},{"id":"p012_04","en":"I'd like to pay by card.","ko":"카드로 계산하고 싶어요."},{"id":"p012_10","en":"I'd like to ask a question.","ko":"질문 하나 하고 싶어요."}]},{"n":8,"o":13,"t":"I want ___.","e":[{"id":"p013_02","en":"I want a window seat.","ko":"창가 자리를 원해요."},{"id":"p013_04","en":"I want a cold drink.","ko":"시원한 음료가 마시고 싶어요."},{"id":"p013_06","en":"I want to rest for a while.","ko":"잠깐 쉬고 싶어요."},{"id":"p013_10","en":"I want to learn English.","ko":"영어를 배우고 싶어요."}]},{"n":9,"o":14,"t":"I need ___.","e":[{"id":"p014_02","en":"I need a taxi.","ko":"택시가 필요해요."},{"id":"p014_03","en":"I need some water.","ko":"물이 좀 필요해요."},{"id":"p014_04","en":"I need a doctor.","ko":"의사가 필요해요."},{"id":"p014_09","en":"I need your help.","ko":"당신의 도움이 필요해요."}]},{"n":10,"o":15,"t":"I'm looking for ___.","e":[{"id":"p015_02","en":"I'm looking for a coffee shop.","ko":"커피숍을 찾고 있어요."},{"id":"p015_05","en":"I'm looking for my friend.","ko":"친구를 찾고 있어요."},{"id":"p015_06","en":"I'm looking for an ATM.","ko":"ATM을 찾고 있어요."},{"id":"p015_07","en":"I'm looking for a cheap hotel.","ko":"저렴한 호텔을 찾고 있어요."}]}]},{"g":"묻기","p":[{"n":11,"o":21,"t":"Where is ___?","e":[{"id":"p021","en":"Where is the restroom?","ko":"화장실이 어디예요?"},{"id":"p021_02","en":"Where is the nearest subway station?","ko":"가장 가까운 지하철역이 어디예요?"},{"id":"p021_05","en":"Where is gate 14?","ko":"14번 게이트가 어디예요?"},{"id":"p021_09","en":"Where is the elevator?","ko":"엘리베이터가 어디예요?"}]},{"n":12,"o":22,"t":"What time ___?","e":[{"id":"p022","en":"What time does the shop close?","ko":"가게는 몇 시에 닫아요?"},{"id":"p022_02","en":"What time does the train leave?","ko":"기차는 몇 시에 출발해요?"},{"id":"p022_03","en":"What time is check-out?","ko":"체크아웃은 몇 시예요?"},{"id":"p022_04","en":"What time does the museum open?","ko":"박물관은 몇 시에 열어요?"}]},{"n":13,"o":23,"t":"How much is ___?","e":[{"id":"p023","en":"How much is this jacket?","ko":"이 재킷 얼마예요?"},{"id":"p023_02","en":"How much is the ticket?","ko":"표는 얼마예요?"},{"id":"p023_05","en":"How much is a single room?","ko":"1인실은 얼마예요?"},{"id":"p023_08","en":"How much is a cup of coffee?","ko":"커피 한 잔은 얼마예요?"}]},{"n":14,"o":24,"t":"How do I get to ___?","e":[{"id":"p024","en":"How do I get to the station?","ko":"역에 어떻게 가나요?"},{"id":"p024_02","en":"How do I get to the airport?","ko":"공항에 어떻게 가나요?"},{"id":"p024_05","en":"How do I get to the hotel?","ko":"호텔에 어떻게 가나요?"},{"id":"p024_08","en":"How do I get to this address?","ko":"이 주소에 어떻게 가나요?"}]},{"n":15,"o":26,"t":"Is there ___ near here?","e":[{"id":"p026","en":"Is there a pharmacy near here?","ko":"근처에 약국 있어요?"},{"id":"p026_03","en":"Is there a bank near here?","ko":"근처에 은행 있어요?"},{"id":"p026_04","en":"Is there a good restaurant near here?","ko":"근처에 맛있는 식당 있어요?"},{"id":"p026_09","en":"Is there a hospital near here?","ko":"근처에 병원 있어요?"}]}]},{"g":"허락과 확인","p":[{"n":16,"o":31,"t":"Can I ___?","e":[{"id":"p031","en":"Can I try this on?","ko":"이거 입어봐도 돼요?"},{"id":"p031_02","en":"Can I sit here?","ko":"여기 앉아도 돼요?"},{"id":"p031_04","en":"Can I pay by card?","ko":"카드로 내도 돼요?"},{"id":"p031_08","en":"Can I charge my phone here?","ko":"여기서 휴대폰 충전해도 돼요?"}]},{"n":17,"o":32,"t":"May I ___?","e":[{"id":"p032","en":"May I come in?","ko":"들어가도 될까요?"},{"id":"p032_02","en":"May I ask a question?","ko":"질문해도 될까요?"},{"id":"p032_04","en":"May I see the menu?","ko":"메뉴를 봐도 될까요?"},{"id":"p032_07","en":"May I borrow your phone?","ko":"전화기를 빌려도 될까요?"}]},{"n":18,"o":33,"t":"Is it okay if I ___?","e":[{"id":"p033","en":"Is it okay if I take a photo?","ko":"사진 찍어도 괜찮을까요?"},{"id":"p033_02","en":"Is it okay if I sit here?","ko":"여기 앉아도 괜찮을까요?"},{"id":"p033_07","en":"Is it okay if I check in early?","ko":"일찍 체크인해도 괜찮을까요?"},{"id":"p033_09","en":"Is it okay if I pay tomorrow?","ko":"내일 내도 괜찮을까요?"}]},{"n"
