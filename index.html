<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12222B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>영어 패턴 100</title>
<style>
:root{--bg:#12222B;--card:#1E3540;--line:#3A525B;--text:#EAF1EE;--sub:#9FB3B8;--hi:#F2C14E;--on-hi:#2A1F00}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
#app{height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#top{flex:1;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:16px 20px 14px;min-height:0}
#bar{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;color:var(--sub)}
#pick{border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 14px;color:var(--sub);font-size:14px}
#auto{border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 14px;color:var(--sub);font-size:14px}
#auto.on{background:var(--hi);color:var(--on-hi);border-color:var(--hi)}
#en{font-size:clamp(24px,7vw,32px);line-height:1.3;font-weight:500;overflow-wrap:anywhere}
#en b{color:var(--hi);font-weight:500}
#ko{font-size:16px;color:var(--sub);margin-top:12px;line-height:1.5}
#pat{font-size:13px;color:var(--sub);margin-bottom:10px}
#dots{display:flex;gap:6px;align-items:center;min-height:6px}
#dots span{height:6px;border-radius:999px;background:var(--line);width:6px}
#dots span.on{background:var(--hi);width:18px}
#ctl{flex:1;min-height:0;padding:14px 16px 18px;display:flex;flex-direction:column;justify-content:center;gap:12px;border-top:1.5px dashed var(--hi)}
.row{display:flex;gap:8px}
.pl{flex:1;height:60px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:16px}
.pl.on{background:var(--hi);color:var(--on-hi);border-color:var(--hi);font-weight:500}
.nv{flex:1;height:52px;border-radius:999px;background:transparent;border:1px solid var(--line);color:var(--sub);font-size:15px}
.nv.go{border-color:var(--sub);color:var(--text)}
#msg{font-size:13px;color:var(--sub);text-align:center;min-height:16px}
#sheet{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);z-index:5}
#sheet.open{display:flex}
#sh-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px 8px;font-size:15px}
#sh-close{border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 14px;color:var(--sub);font-size:14px}
#lv1,#groups{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.g{border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 14px;font-size:14px;color:var(--sub)}
.g.on{background:var(--hi);color:var(--on-hi);border-color:var(--hi)}
#plist{flex:1;overflow-y:auto;padding:0 20px 20px}
.p{display:flex;gap:14px;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--line);padding:14px 2px;font-size:16px}
.p i{font-style:normal;color:var(--sub);min-width:28px}
.p.on{color:var(--hi)}
.p small{display:block;font-size:12px;color:var(--sub);margin-top:3px}
.lb{width:100%;font-size:12px;color:var(--sub)}
#mode{padding:8px 20px 4px;display:flex;gap:8px}
#lv1{padding:8px 20px 4px}#groups{padding:4px 20px 12px}
</style>
</head>
<body>
<div id="app">
<section id="top">
<div id="bar"><button id="pick" aria-haspopup="dialog"></button><button id="auto" aria-pressed="false">자동 재생</button><span id="cnt"></span></div>
<div><div id="pat"></div><div id="en"></div><div id="ko"></div></div>
<div id="dots"></div>
</section>
<section id="ctl">
<div id="msg" role="status"></div>
<div class="row">
<button class="pl" data-k="ko">한국어</button>
<button class="pl" data-k="slow">천천히</button>
<button class="pl" data-k="normal">보통</button>
</div>
<div class="row">
<button class="nv" id="prev">‹ 이전</button>
<button class="nv go" id="next">다음 ›</button>
</div>
</section>
</div>
<div id="sheet" role="dialog" aria-label="패턴 고르기">
<div id="sh-head"><span>패턴 고르기</span><button id="sh-close">닫기</button></div>
<div id="mode"></div>
<div id="lv1" class="chips"></div>
<div id="groups" class="chips"></div>
<div id="plist"></div>
</div>
<script>
var DATA=[{"g":"부탁하기","p":[{"n":1,"t":"Could I get ___, please?","e":[{"id":"p001","en":"Could I get a glass of water, please?","ko":"물 한 잔 주실 수 있나요?"},{"id":"p001_02","en":"Could I get the check, please?","ko":"계산서 주실 수 있나요?"},{"id":"p001_03","en":"Could I get an extra towel, please?","ko":"수건 한 장 더 주실 수 있나요?"},{"id":"p001_04","en":"Could I get a receipt, please?","ko":"영수증 주실 수 있나요?"},{"id":"p001_05","en":"Could I get a coffee with milk, please?","ko":"우유 넣은 커피 한 잔 주실 수 있나요?"},{"id":"p001_06","en":"Could I get a blanket, please?","ko":"담요 하나 주실 수 있나요?"},{"id":"p001_07","en":"Could I get a bag for this, please?","ko":"이거 담을 봉투 주실 수 있나요?"},{"id":"p001_08","en":"Could I get another fork, please?","ko":"포크 하나 더 주실 수 있나요?"},{"id":"p001_09","en":"Could I get a map, please?","ko":"지도 하나 주실 수 있나요?"},{"id":"p001_10","en":"Could I get a table by the window, please?","ko":"창가 자리로 주실 수 있나요?"}]},{"n":2,"t":"Could you ___?","e":[{"id":"p002","en":"Could you help me with this bag?","ko":"이 가방 좀 도와주실 수 있어요?"},{"id":"p002_02","en":"Could you call a taxi for me?","ko":"택시 좀 불러주실 수 있어요?"},{"id":"p002_03","en":"Could you hold this for a second?","ko":"잠깐 이것 좀 들어주실 수 있어요?"},{"id":"p002_04","en":"Could you open the door, please?","ko":"문 좀 열어주실 수 있어요?"},{"id":"p002_05","en":"Could you turn down the music?","ko":"음악 소리 좀 줄여주실 수 있어요?"},{"id":"p002_06","en":"Could you check my reservation?","ko":"제 예약 좀 확인해주실 수 있어요?"},{"id":"p002_07","en":"Could you wake me up at seven?","ko":"7시에 깨워주실 수 있어요?"},{"id":"p002_08","en":"Could you move your bag a little?","ko":"가방을 조금만 옮겨주실 수 있어요?"},{"id":"p002_09","en":"Could you take our order now?","ko":"지금 주문 받아주실 수 있어요?"},{"id":"p002_10","en":"Could you tell me the way to the museum?","ko":"박물관 가는 길 알려주실 수 있어요?"}]},{"n":3,"t":"Can you ___ for me?","e":[{"id":"p003","en":"Can you take a picture for me?","ko":"사진 좀 찍어주실래요?"},{"id":"p003_02","en":"Can you hold my seat for me?","ko":"제 자리 좀 맡아줄래요?"},{"id":"p003_03","en":"Can you check the time for me?","ko":"시간 좀 확인해줄래요?"},{"id":"p003_04","en":"Can you carry this for me?","ko":"이것 좀 들어줄래요?"},{"id":"p003_05","en":"Can you book a table for me?","ko":"자리 좀 예약해줄래요?"},{"id":"p003_06","en":"Can you translate this for me?","ko":"이것 좀 번역해줄래요?"},{"id":"p003_07","en":"Can you call my room for me?","ko":"제 방에 전화 좀 해줄래요?"},{"id":"p003_08","en":"Can you keep an eye on my bag for me?","ko":"제 가방 좀 봐줄래요?"},{"id":"p003_09","en":"Can you print this for me?","ko":"이것 좀 출력해줄래요?"},{"id":"p003_10","en":"Can you find the address for me?","ko":"주소 좀 찾아줄래요?"}]},{"n":4,"t":"Would you mind ___ing?","e":[{"id":"p004","en":"Would you mind closing the window?","ko":"창문 좀 닫아주실 수 있을까요?"},{"id":"p004_02","en":"Would you mind moving over a little?","ko":"조금만 옆으로 가주실 수 있을까요?"},{"id":"p004_03","en":"Would you mind turning off the light?","ko":"불 좀 꺼주실 수 있을까요?"},{"id":"p004_04","en":"Would you mind waiting a moment?","ko":"잠시만 기다려주실 수 있을까요?"},{"id":"p004_05","en":"Would you mind taking our picture?","ko":"사진 좀 찍어주실 수 있을까요?"},{"id":"p004_06","en":"Would you mind opening the window?","ko":"창문 좀 열어주실 수 있을까요?"},{"id":"p004_07","en":"Would you mind watching my bag?","ko":"제 가방 좀 봐주실 수 있을까요?"},{"id":"p004_08","en":"Would you mind lowering your voice?","ko":"목소리를 조금만 낮춰주실 수 있을까요?"},{"id":"p004_09","en":"Would you mind speaking slowly?","ko":"천천히 말씀해주실 수 있을까요?"},{"id":"p004_10","en":"Would you mind giving me a hand?","ko":"좀 도와주실 수 있을까요?"}]},{"n":5,"t":"I was wondering if you could ___.","e":[{"id":"p005","en":"I was wondering if you could recommend a place.","ko":"장소를 추천해 주실 수 있을까 해서요."},{"id":"p005_02","en":"I was wondering if you could help me.","ko":"도와주실 수 있을까 해서요."},{"id":"p005_03","en":"I was wondering if you could change my seat.","ko":"자리를 바꿔주실 수 있을까 해서요."},{"id":"p005_04","en":"I was wondering if you could call a taxi.","ko":"택시를 불러주실 수 있을까 해서요."},{"id":"p005_05","en":"I was wondering if you could show me the way.","ko":"길을 알려주실 수 있을까 해서요."},{"id":"p005_06","en":"I was wondering if you could give me a discount.","ko":"할인해주실 수 있을까 해서요."},{"id":"p005_07","en":"I was wondering if you could hold my luggage.","ko":"제 짐을 맡아주실 수 있을까 해서요."},{"id":"p005_08","en":"I was wondering if you could check again.","ko":"다시 확인해주실 수 있을까 해서요."},{"id":"p005_09","en":"I was wondering if you could recommend a restaurant.","ko":"식당을 추천해주실 수 있을까 해서요."},{"id":"p005_10","en":"I was wondering if you could explain this to me.","ko":"이걸 설명해주실 수 있을까 해서요."}]},{"n":6,"t":"Do you have ___?","e":[{"id":"p006","en":"Do you have this in a smaller size?","ko":"이거 더 작은 사이즈 있어요?"},{"id":"p006_02","en":"Do you have a table for two?","ko":"두 명 자리 있어요?"},{"id":"p006_03","en":"Do you have a vegetarian option?","ko":"채식 메뉴 있어요?"},{"id":"p006_04","en":"Do you have a phone charger?","ko":"휴대폰 충전기 있어요?"},{"id":"p006_05","en":"Do you have any rooms available?","ko":"빈 방 있어요?"},{"id":"p006_06","en":"Do you have this in blue?","ko":"이거 파란색 있어요?"},{"id":"p006_07","en":"Do you have a menu in English?","ko":"영어 메뉴판 있어요?"},{"id":"p006_08","en":"Do you have free Wi-Fi?","ko":"무료 와이파이 있어요?"},{"id":"p006_09","en":"Do you have anything cheaper?","ko":"더 저렴한 거 있어요?"},{"id":"p006_10","en":"Do you have a larger size?","ko":"더 큰 사이즈 있어요?"}]},{"n":7,"t":"Please ___.","e":[{"id":"p007","en":"Please wait here for a moment.","ko":"잠깐 여기서 기다려 주세요."},{"id":"p007_02","en":"Please send it to my room.","ko":"제 방으로 보내주세요."},{"id":"p007_03","en":"Please call me when it's ready.","ko":"준비되면 전화해주세요."},{"id":"p007_04","en":"Please keep the change.","ko":"거스름돈은 가지세요."},{"id":"p007_05","en":"Please take a seat.","ko":"앉으세요."},{"id":"p007_06","en":"Please add this to my bill.","ko":"이거 계산서에 추가해주세요."},{"id":"p007_07","en":"Please wrap this as a gift.","ko":"선물 포장해주세요."},{"id":"p007_08","en":"Please pack this carefully.","ko":"이거 조심해서 포장해주세요."},{"id":"p007_09","en":"Please give me a minute.","ko":"잠시만 시간을 주세요."},{"id":"p007_10","en":"Please turn on the heater.","ko":"히터를 켜주세요."}]},{"n":8,"t":"Can I have ___?","e":[{"id":"p008","en":"Can I have t
