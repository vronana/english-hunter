<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12222B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>영어 패턴 100</title>
<style>
:root{--bg:#12222B;--card:#1E3540;--line:#3A525B;--text:#EAF1EE;--sub:#9FB3B8;--hi:#F2C14E;--on-hi:#2A1F00}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
#app{height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#top{flex:1;display:flex;flex-direction:column;justify-content:space-between;padding:16px 20px 14px;min-height:0}
#bar{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;color:var(--sub)}
#pick{border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 14px;color:var(--sub);font-size:14px}
#auto{border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 14px;color:var(--sub);font-size:14px}
#auto.on{background:var(--hi);color:var(--on-hi);border-color:var(--hi)}
#en{font-size:clamp(24px,7vw,32px);line-height:1.3;font-weight:500;overflow-wrap:anywhere}
#en b{color:var(--hi);font-weight:500}
#ko{font-size:16px;color:var(--sub);margin-top:12px;line-height:1.5}
#pat{font-size:13px;color:var(--sub);margin-bottom:10px}
#dots{display:flex;gap:6px;align-items:center;min-height:6px}
#dots span{height:6px;border-radius:999px;background:var(--line);width:6px}
#dots span.on{background:var(--hi);width:18px}
#ctl{padding:14px 16px 18px;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line)}
.row{display:flex;gap:8px}
.pl{flex:1;height:56px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:16px}
.pl.on{background:var(--hi);color:var(--on-hi);border-color:var(--hi);font-weight:500}
.nv{flex:1;height:46px;border-radius:999px;background:transparent;border:1px solid var(--line);color:var(--sub);font-size:15px}
.nv.go{border-color:var(--sub);color:var(--text)}
#msg{font-size:13px;color:var(--sub);text-align:center;min-height:16px}
#sheet{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);z-index:5}
#sheet.open{display:flex}
#sh-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px 8px;font-size:15px}
#sh-close{border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 14px;color:var(--sub);font-size:14px}
#groups{display:flex;flex-wrap:wrap;gap:8px;padding:8px 20px 12px}
.g{border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 14px;font-size:14px;color:var(--sub)}
.g.on{background:var(--hi);color:var(--on-hi);border-color:var(--hi)}
#plist{flex:1;overflow-y:auto;padding:0 20px 20px}
.p{display:flex;gap:14px;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--line);padding:14px 2px;font-size:16px}
.p i{font-style:normal;color:var(--sub);min-width:28px}
.p.on{color:var(--hi)}
</style>
</head>
<body>
<div id="app">
<section id="top">
<div id="bar"><button id="pick" aria-haspopup="dialog"></button><button id="auto" aria-pressed="false">자동 재생</button><span id="cnt"></span></div>
<div><div id="pat"></div><div id="en"></div><div id="ko"></div></div>
<div id="dots"></div>
</section>
<section id="ctl">
<div id="msg" role="status"></div>
<div class="row">
<button class="pl" data-k="ko">한국어</button>
<button class="pl" data-k="slow">천천히</button>
<button class="pl" data-k="normal">보통</button>
</div>
<div class="row">
<button class="nv" id="prev">‹ 이전</button>
<button class="nv go" id="next">다음 ›</button>
</div>
</section>
</div>
<div id="sheet" role="dialog" aria-label="패턴 고르기">
<div id="sh-head"><span>패턴 고르기</span><button id="sh-close">닫기</button></div>
<div id="groups"></div>
<div id="plist"></div>
</div>
<script>
var DATA=[{"g":"부탁하기","p":[{"n":1,"t":"Could I get ___, please?","e":[{"id":"p001","en":"Could I get a glass of water, please?","ko":"물 한 잔 주실 수 있나요?"},{"id":"p001_02","en":"Could I get the check, please?","ko":"계산서 주실 수 있나요?"},{"id":"p001_03","en":"Could I get an extra towel, please?","ko":"수건 한 장 더 주실 수 있나요?"},{"id":"p001_04","en":"Could I get a receipt, please?","ko":"영수증 주실 수 있나요?"},{"id":"p001_05","en":"Could I get a coffee with milk, please?","ko":"우유 넣은 커피 한 잔 주실 수 있나요?"},{"id":"p001_06","en":"Could I get a blanket, please?","ko":"담요 하나 주실 수 있나요?"},{"id":"p001_07","en":"Could I get a bag for this, please?","ko":"이거 담을 봉투 주실 수 있나요?"},{"id":"p001_08","en":"Could I get another fork, please?","ko":"포크 하나 더 주실 수 있나요?"},{"id":"p001_09","en":"Could I get a map, please?","ko":"지도 하나 주실 수 있나요?"},{"id":"p001_10","en":"Could I get a table by the window, please?","ko":"창가 자리로 주실 수 있나요?"}]},{"n":2,"t":"Could you ___?","e":[{"id":"p002","en":"Could you help me with this bag?","ko":"이 가방 좀 도와주실 수 있어요?"},{"id":"p002_02","en":"Could you call a taxi for me?","ko":"택시 좀 불러주실 수 있어요?"},{"id":"p002_03","en":"Could you hold this for a second?","ko":"잠깐 이것 좀 들어주실 수 있어요?"},{"id":"p002_04","en":"Could you open the door, please?","ko":"문 좀 열어주실 수 있어요?"},{"id":"p002_05","en":"Could you turn down the music?","ko":"음악 소리 좀 줄여주실 수 있어요?"},{"id":"p002_06","en":"Could you check my reservation?","ko":"제 예약 좀 확인해주실 수 있어요?"},{"id":"p002_07","en":"Could you wake me up at seven?","ko":"7시에 깨워주실 수 있어요?"},{"id":"p002_08","en":"Could you move your bag a little?","ko":"가방을 조금만 옮겨주실 수 있어요?"},{"id":"p002_09","en":"Could you take our order now?","ko":"지금 주문 받아주실 수 있어요?"},{"id":"p002_10","en":"Could you tell me the way to the museum?","ko":"박물관 가는 길 알려주실 수 있어요?"}]},{"n":3,"t":"Can you ___ for me?","e":[{"id":"p003","en":"Can you take a picture for me?","ko":"사진 좀 찍어주실래요?"},{"id":"p003_02","en":"Can you hold my seat for me?","ko":"제 자리 좀 맡아줄래요?"},{"id":"p003_03","en":"Can you check the time for me?","ko":"시간 좀 확인해줄래요?"},{"id":"p003_04","en":"Can you carry this for me?","ko":"이것 좀 들어줄래요?"},{"id":"p003_05","en":"Can you book a table for me?","ko":"자리 좀 예약해줄래요?"},{"id":"p003_06","en":"Can you translate this for me?","ko":"이것 좀 번역해줄래요?"},{"id":"p003_07","en":"Can you call my room for me?","ko":"제 방에 전화 좀 해줄래요?"},{"id":"p003_08","en":"Can you keep an eye on my bag for me?","ko":"제 가방 좀 봐줄래요?"},{"id":"p003_09","en":"Can you print this for me?","ko":"이것 좀 출력해줄래요?"},{"id":"p003_10","en":"Can you find the address for me?","ko":"주소 좀 찾아줄래요?"}]},{"n":4,"t":"Would you mind ___ing?","e":[{"id":"p004","en":"Would you mind closing the window?","ko":"창문 좀 닫아주실 수 있을까요?"},{"id":"p004_02","en":"Would you mind moving over a little?","ko":"조금만 옆으로 가주실 수 있을까요?"},{"id":"p004_03","en":"Would you mind turning off the light?","ko":"불 좀 꺼주실 수 있을까요?"},{"id":"p004_04","en":"Would you mind waiting a moment?","ko":"잠시만 기다려주실 수 있을까요?"},{"id":"p004_05","en":"Would you mind taking our picture?","ko":"사진 좀 찍어주실 수 있을까요?"},{"id":"p004_06","en":"Would you mind opening the window?","ko":"창문 좀 열어주실 수 있을까요?"},{"id":"p004_07","en":"Would you mind watching my bag?","ko":"제 가방 좀 봐주실 수 있을까요?"},{"id":"p004_08","en":"Would you mind lowering your voice?","ko":"목소리를 조금만 낮춰주실 수 있을까요?"},{"id":"p004_09","en":"Would you mind speaking slowly?","ko":"천천히 말씀해주실 수 있을까요?"},{"id":"p004_10","en":"Would you mind giving me a hand?","ko":"좀 도와주실 수 있을까요?"}]},{"n":5,"t":"I was wondering if you could ___.","e":[{"id":"p005","en":"I was wondering if you could recommend a place.","ko":"장소를 추천해 주실 수 있을까 해서요."},{"id":"p005_02","en":"I was wondering if you could help me.","ko":"도와주실 수 있을까 해서요."},{"id":"p005_03","en":"I was wondering if you could change my seat.","ko":"자리를 바꿔주실 수 있을까 해서요."},{"id":"p005_04","en":"I was wondering if you could call a taxi.","ko":"택시를 불러주실 수 있을까 해서요."},{"id":"p005_05","en":"I was wondering if you could show me the way.","ko":"길을 알려주실 수 있을까 해서요."},{"id":"p005_06","en":"I was wondering if you could give me a discount.","ko":"할인해주실 수 있을까 해서요."},{"id":"p005_07","en":"I was wondering if you could hold my luggage.","ko":"제 짐을 맡아주실 수 있을까 해서요."},{"id":"p005_08","en":"I was wondering if you could check again.","ko":"다시 확인해주실 수 있을까 해서요."},{"id":"p005_09","en":"I was wondering if you could recommend a restaurant.","ko":"식당을 추천해주실 수 있을까 해서요."},{"id":"p005_10","en":"I was wondering if you could explain this to me.","ko":"이걸 설명해주실 수 있을까 해서요."}]},{"n":6,"t":"Do you have ___?","e":[{"id":"p006","en":"Do you have this in a smaller size?","ko":"이거 더 작은 사이즈 있어요?"},{"id":"p006_02","en":"Do you have a table for two?","ko":"두 명 자리 있어요?"},{"id":"p006_03","en":"Do you have a vegetarian option?","ko":"채식 메뉴 있어요?"},{"id":"p006_04","en":"Do you have a phone charger?","ko":"휴대폰 충전기 있어요?"},{"id":"p006_05","en":"Do you have any rooms available?","ko":"빈 방 있어요?"},{"id":"p006_06","en":"Do you have this in blue?","ko":"이거 파란색 있어요?"},{"id":"p006_07","en":"Do you have a menu in English?","ko":"영어 메뉴판 있어요?"},{"id":"p006_08","en":"Do you have free Wi-Fi?","ko":"무료 와이파이 있어요?"},{"id":"p006_09","en":"Do you have anything cheaper?","ko":"더 저렴한 거 있어요?"},{"id":"p006_10","en":"Do you have a larger size?","ko":"더 큰 사이즈 있어요?"}]},{"n":7,"t":"Please ___.","e":[{"id":"p007","en":"Please wait here for a moment.","ko":"잠깐 여기서 기다려 주세요."},{"id":"p007_02","en":"Please send it to my room.","ko":"제 방으로 보내주세요."},{"id":"p007_03","en":"Please call me when it's ready.","ko":"준비되면 전화해주세요."},{"id":"p007_04","en":"Please keep the change.","ko":"거스름돈은 가지세요."},{"id":"p007_05","en":"Please take a seat.","ko":"앉으세요."},{"id":"p007_06","en":"Please add this to my bill.","ko":"이거 계산서에 추가해주세요."},{"id":"p007_07","en":"Please wrap this as a gift.","ko":"선물 포장해주세요."},{"id":"p007_08","en":"Please pack this carefully.","ko":"이거 조심해서 포장해주세요."},{"id":"p007_09","en":"Please give me a minute.","ko":"잠시만 시간을 주세요."},{"id":"p007_10","en":"Please turn on the heater.","ko":"히터를 켜주세요."}]},{"n":8,"t":"Can I have ___?","e":[{"id":"p008","en":"Can I have t _07","en":"First, pay at the counter. Then, take your food.","ko":"먼저 계산대에서 계산하세요. 그다음 음식을 가져가세요."},{"id":"p098_08","en":"First, cross the bridge. Then, turn left.","ko":"먼저 다리를 건너세요. 그다음 좌회전하세요."},{"id":"p098_09","en":"First, press this button. Then, wait.","ko":"먼저 이 버튼을 누르세요. 그다음 기다리세요."},{"id":"p098_10","en":"First, get a number. Then, wait for your turn.","ko":"먼저 번호표를 뽑으세요. 그다음 차례를 기다리세요."}]},{"n":99,"t":"It looks like ___.","e":[{"id":"p099","en":"It looks like a small bag.","ko":"작은 가방처럼 생겼어요."},{"id":"p099_02","en":"It looks like rain.","ko":"비가 올 것 같아요."},{"id":"p099_03","en":"It looks like a small cat.","ko":"작은 고양이처럼 생겼어요."},{"id":"p099_04","en":"It looks like a mistake.","ko":"실수인 것 같아요."},{"id":"p099_05","en":"It looks like the same one.","ko":"같은 것처럼 보여요."},{"id":"p099_06","en":"It looks like a good place.","ko":"좋은 곳 같아요."},{"id":"p099_07","en":"It looks like a long line.","ko":"줄이 긴 것 같아요."},{"id":"p099_08","en":"It looks like a typo.","ko":"오타인 것 같아요."},{"id":"p099_09","en":"It looks like we're lost.","ko":"길을 잃은 것 같아요."},{"id":"p099_10","en":"It looks like a park from here.","ko":"여기서 보면 공원처럼 보여요."}]},{"n":100,"t":"What happened was ___.","e":[{"id":"p100","en":"What happened was my card didn't work.","ko":"카드가 안 됐어요."},{"id":"p100_02","en":"What happened was I missed the train.","ko":"기차를 놓쳤어요."},{"id":"p100_03","en":"What happened was my phone died.","ko":"휴대폰이 꺼졌어요."},{"id":"p100_04","en":"What happened was the door locked behind me.","ko":"문이 뒤에서 잠겼어요."},{"id":"p100_05","en":"What happened was I lost my way.","ko":"길을 잃었어요."},{"id":"p100_06","en":"What happened was the line was too long.","ko":"줄이 너무 길었어요."},{"id":"p100_07","en":"What happened was I forgot my wallet.","ko":"지갑을 깜빡했어요."},{"id":"p100_08","en":"What happened was the shop was closed.","ko":"가게가 닫혀 있었어요."},{"id":"p100_09","en":"What happened was it started to rain.","ko":"비가 오기 시작했어요."},{"id":"p100_10","en":"What happened was I took the wrong bus.","ko":"버스를 잘못 탔어요."}]}]}];
var gi=0,pi=0,ei=0,sg=0;
var $=function(i){return document.getElementById(i)};
var au=new Audio(),btns=document.querySelectorAll('.pl');
try{var sv=JSON.parse(localStorage.getItem('pos')||'null');if(sv&&DATA[sv[0]]&&DATA[sv[0]].p[sv[1]]){gi=sv[0];pi=sv[1];ei=Math.min(sv[2]||0,DATA[gi].p[pi].e.length-1)}}catch(e){}
sg=gi;
function cur(){return DATA[gi].p[pi]}
function save(){try{localStorage.setItem('pos',JSON.stringify([gi,pi,ei]))}catch(e){}}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function draw(){
 stop();
 var p=cur(),it=p.e[ei];
 $('pick').textContent=DATA[gi].g+' · 패턴 '+p.n+' ▾';
 $('cnt').textContent=(ei+1)+' / '+p.e.length;
 $('pat').textContent=p.t;
 var pre=p.t.split('___')[0].trim(),en=it.en,h;
 if(pre&&en.toLowerCase().indexOf(pre.toLowerCase())===0){h='<b>'+esc(en.slice(0,pre.length))+'</b>'+esc(en.slice(pre.length))}else{h=esc(en)}
 $('en').innerHTML=h;
 $('ko').textContent=it.ko;
 var d='';for(var k=0;k<p.e.length;k++)d+='<span'+(k===ei?' class="on"':'')+'></span>';
 $('dots').innerHTML=d;
 $('msg').textContent='';
 save();
 if(auto)seq();
}
function stop(){try{au.pause()}catch(e){}btns.forEach(function(b){b.classList.remove('on')})}
function play(k,b,cb){
 stop();
 var it=cur().e[ei];
 au=new Audio('audio/'+it.id+'_'+k+'.mp3');
 b.classList.add('on');
 au.onended=function(){b.classList.remove('on');if(cb)cb()};
 au.onerror=function(){b.classList.remove('on');$('msg').textContent='소리 파일을 못 찾았어요'};
 $('msg').textContent='';
 var r=au.play();if(r&&r.catch)r.catch(function(){});
}
var auto=false,tok=0,timer=null;
function seq(){
 var t=++tok,i=0,order=['ko','slow','normal'];clearTimeout(timer);
 (function next(){
  if(!auto||t!==tok)return;
  if(i>=order.length){timer=setTimeout(function(){if(auto&&t===tok)step(1)},1500);return}
  var k=order[i++],b=document.querySelector('.pl[data-k="'+k+'"]');
  play(k,b,function(){setTimeout(next,500)});
 })();
}
function setAuto(v){
 auto=v;tok++;clearTimeout(timer);
 $('auto').classList.toggle('on',v);$('auto').setAttribute('aria-pressed',v?'true':'false');
 if(v)seq();else stop();
}
$('auto').onclick=function(){setAuto(!auto)};
btns.forEach(function(b){b.onclick=function(){if(auto)setAuto(false);play(b.dataset.k,b)}});
function step(d){
 var p=cur();ei+=d;
 if(ei>=p.e.length){ei=0;pi++;if(pi>=DATA[gi].p.length){pi=0;gi=(gi+1)%DATA.length}}
 else if(ei<0){pi--;if(pi<0){gi=(gi+DATA.length-1)%DATA.length;pi=DATA[gi].p.length-1}ei=cur().e.length-1}
 draw();
}
$('next').onclick=function(){step(1)};
$('prev').onclick=function(){step(-1)};
var x0=null;
$('top').addEventListener('touchstart',function(e){x0=e.touches[0].clientX},{passive:true});
$('top').addEventListener('touchend',function(e){if(x0===null)return;var dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>60)step(dx<0?1:-1)},{passive:true});
function sheet(){
 var g='';DATA.forEach(function(x,i){g+='<button class="g'+(i===sg?' on':'')+'" data-i="'+i+'">'+esc(x.g)+'</button>'});
 $('groups').innerHTML=g;
 var l='';DATA[sg].p.forEach(function(p,i){l+='<button class="p'+(sg===gi&&i===pi?' on':'')+'" data-i="'+i+'"><i>'+p.n+'</i><span>'+esc(p.t)+'</span></button>'});
 $('plist').innerHTML=l;
}
$('pick').onclick=function(){sg=gi;sheet();$('sheet').classList.add('open')};
$('sh-close').onclick=function(){$('sheet').classList.remove('open')};
$('groups').onclick=function(e){var b=e.target.closest('.g');if(!b)return;sg=+b.dataset.i;sheet();$('plist').scrollTop=0};
$('plist').onclick=function(e){var b=e.target.closest('.p');if(!b)return;gi=sg;pi=+b.dataset.i;ei=0;$('sheet').classList.remove('open');draw()};
draw();
</script>
